name: Release

# Publish the client packages. Add an npm token (All packages, read and write)
# as the repository secret NPM_TOKEN, bump the versions, then run this manually.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/sdk packages/agent-tools packages/mcp-proxy; do
            (cd "$dir" && pnpm publish --access public --no-git-checks)
          done
